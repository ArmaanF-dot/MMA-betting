<style>
/* Layout: one continuous dark world, a fixed WebGL layer behind glass panels. Each upcoming card is a chapter in its own light colour with a
   verdict, a stake per fight, expected earnings and a timeline. Evidence and the rule come last. Everything shown comes from the exported data. */
:root {
  --void: #04050A;      --ink: #E8EDF7;      --mist: #8C97AD;
  --ice: #5CE1FF;       --ember: #FF3D4F;    --jade: #2EF2A0;    --amber: #FFC21A;
  --good: #2EF2A0;      --bad: #FF5C6C;
  --acc: #5CE1FF;
  --line: rgba(232, 237, 247, 0.13);   --glass: rgba(255, 255, 255, 0.04);
  --display: "Unbounded", "Arial Black", Helvetica, sans-serif;
  --body: "Sora", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --h1: clamp(2.8rem, 10vw, 11rem);
  --h2: clamp(1.9rem, 4.8vw, 5.4rem);
  --h3: clamp(1.4rem, 2.6vw, 2.4rem);
  --statement: clamp(1.15rem, 1.8vw, 1.7rem);
  --gap: clamp(80px, 11vw, 160px);
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--void); }
body { margin: 0; background: var(--void); color: var(--ink); font: 300 1.0625rem/1.65 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
::selection { background: var(--acc); color: var(--void); }
a { color: inherit; }
img, video { display: block; max-width: 100%; }
p { margin: 0; text-wrap: pretty; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 800; text-wrap: balance; text-transform: uppercase; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--acc); outline-offset: 4px; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); position: relative; }
@media (min-width: 901px) { .wrap { padding-left: max(72px, env(safe-area-inset-left, 0px)); } }
main, footer { position: relative; z-index: 2; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.fx.tint { background: radial-gradient(60vw 50vh at 78% 30%, color-mix(in srgb, var(--acc) 22%, transparent), transparent 70%), radial-gradient(50vw 50vh at 8% 90%, color-mix(in srgb, var(--acc) 12%, transparent), transparent 70%); mix-blend-mode: screen; }
.fx.grid { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 64px 64px; opacity: .3; mask-image: radial-gradient(70vw 70vh at 50% 40%, #000, transparent 75%); -webkit-mask-image: radial-gradient(70vw 70vh at 50% 40%, #000, transparent 75%); }
.fx.vig { background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0, 0, 0, .65)); }
.fx.grain { opacity: .06; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 1.2s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0, 0) } 20% { transform: translate(-3%, 2%) } 40% { transform: translate(2%, -3%) } 60% { transform: translate(-2%, -1%) } 80% { transform: translate(3%, 3%) } 100% { transform: translate(0, 0) } }

/* HUD */
.hud { position: fixed; z-index: 30; pointer-events: none; font: 400 .72rem/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }
.pbar { inset: 0 0 auto 0; height: calc(36px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px 30px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; pointer-events: auto; background: rgba(4, 5, 10, .9); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 40; transition: background 400ms; }
.pbar::-webkit-scrollbar { display: none; }
.pbar.flash { background: color-mix(in srgb, var(--acc) 22%, rgba(4, 5, 10, .9)); }
.pbar .seg { display: inline-flex; align-items: center; gap: 8px; letter-spacing: .06em; }
.pbar .seg em { font-style: normal; color: var(--acc); }
.pbar b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.pbar b.pos { color: var(--good); } .pbar b.neg { color: var(--bad); }
.pbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); animation: blink 1.8s infinite; }
.topbar { inset: calc(36px + env(safe-area-inset-top, 0px)) 0 auto 0; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 18px; pointer-events: auto; background: linear-gradient(rgba(4, 5, 10, .78), transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); mask-image: linear-gradient(#000 70%, transparent); -webkit-mask-image: linear-gradient(#000 70%, transparent); }
@media (min-width: 901px) { .topbar { padding-left: max(72px, env(safe-area-inset-left, 0px)); } }
.topbar .mark { font: 800 .95rem/1 var(--display); letter-spacing: .02em; text-decoration: none; color: var(--ink); text-transform: uppercase; white-space: nowrap; }
.topbar .mark i { color: var(--acc); font-style: normal; }
.topbar nav { display: flex; gap: 6px 26px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.topbar nav a { color: var(--ink); text-decoration: none; opacity: .78; transition: opacity 200ms, color 200ms; }
.topbar nav a:hover { opacity: 1; color: var(--acc); }
.live { display: inline-flex; align-items: center; gap: 8px; color: var(--mist); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: blink 1.8s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.rail { inset: 50% auto auto max(14px, env(safe-area-inset-left, 0px)); transform: translateY(-50%); display: grid; gap: 22px; }
.rail a { pointer-events: auto; display: flex; align-items: center; gap: 12px; color: var(--mist); text-decoration: none; transition: color 300ms; }
.rail a::before { content: ""; width: 7px; height: 7px; border: 1px solid currentColor; transform: rotate(45deg); transition: background 300ms, box-shadow 300ms; }
.rail a span { opacity: 0; transform: translateX(-6px); transition: opacity 300ms, transform 300ms var(--ease); white-space: nowrap; background: rgba(4, 5, 10, .85); padding: 4px 8px; }
.rail a.on { color: var(--acc); }
.rail a.on::before { background: var(--acc); box-shadow: 0 0 12px var(--acc); }
.rail a:hover span { opacity: 1; transform: none; }
.meter { inset: auto max(20px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) auto; text-align: right; display: grid; gap: 6px; }
.meter b { color: var(--ink); font-weight: 500; font-size: 1.3rem; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.meter .bar { height: 2px; width: 120px; background: var(--line); margin-left: auto; position: relative; overflow: hidden; }
.meter .bar i { position: absolute; inset: 0; background: var(--acc); transform-origin: left; transform: scaleX(var(--p, 0)); box-shadow: 0 0 10px var(--acc); }
.corner { width: 22px; height: 22px; border: 1px solid var(--line); }
.corner.tl { top: calc(100px + env(safe-area-inset-top, 0px)); left: max(46px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 0; }
.corner.br { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: max(46px, env(safe-area-inset-left, 0px)); border-left: 0; border-top: 0; }
.tag { display: inline-flex; align-items: center; gap: 10px; font: 400 .74rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--acc); }
.tag::before { content: ""; width: 26px; height: 1px; background: currentColor; }
.btn { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 13px 20px; font: 500 .78rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; color: var(--void); background: var(--acc); border: 0; cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: transform 160ms var(--ease); will-change: transform; }
.btn:active { transform: scale(.96); }
.cur { position: fixed; z-index: 60; left: 0; top: 0; width: 38px; height: 38px; margin: -19px 0 0 -19px; border: 1px solid var(--acc); border-radius: 50%; pointer-events: none; opacity: 0; transition: width 250ms var(--ease), height 250ms var(--ease), margin 250ms var(--ease), background 250ms; mix-blend-mode: screen; }
.cur.big { width: 78px; height: 78px; margin: -39px 0 0 -39px; background: color-mix(in srgb, var(--acc) 14%, transparent); }
.cur-dot { position: fixed; z-index: 61; left: 0; top: 0; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--acc); pointer-events: none; opacity: 0; }
@media (hover: none) { .cur, .cur-dot { display: none; } }

/* hero */
.hero { padding-top: calc(clamp(100px, 13vw, 160px) + 36px); padding-bottom: calc(var(--gap) * .6); position: relative; }
.scanline { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--acc); box-shadow: 0 0 24px 6px var(--acc); opacity: 0; pointer-events: none; z-index: 3; }
.hero h1 { font-size: var(--h1); line-height: .9; letter-spacing: -.035em; margin-top: 22px; }
.hero h1 .w { display: block; padding-bottom: .06em; }
.hero h1 .w:nth-child(2) { color: var(--acc); text-shadow: 0 0 70px color-mix(in srgb, var(--acc) 45%, transparent); transition: color 900ms var(--ease); }
.hero h1 .c { display: inline-block; will-change: transform; }
.hero-row { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 32px 4vw; align-items: center; margin-top: clamp(28px, 4vw, 52px); }
.statement { font-size: var(--statement); line-height: 1.35; font-weight: 300; letter-spacing: -.005em; }
.notice { display: flex; gap: 14px; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); background: color-mix(in srgb, var(--amber) 7%, transparent); padding: 14px 18px; font-size: .9rem; color: #e9dcb4; margin-top: 26px; max-width: 46rem; }
.notice::before { content: "!"; flex: none; width: 22px; height: 22px; display: grid; place-items: center; font: 700 .85rem/1 var(--mono); color: var(--void); background: var(--amber); clip-path: polygon(50% 0, 100% 100%, 0 100%); padding-top: 6px; }
.slot { position: relative; width: 100%; aspect-ratio: 1 / 1; }
.hero .slot { aspect-ratio: 1 / .9; }

/* verdict tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 28px; }
.tile { display: grid; gap: 6px; align-content: start; }
.tile .k { font: 400 .7rem/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mist); }
.tile .v { font: 800 clamp(1.5rem, 3vw, 2.7rem)/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--acc); text-shadow: 0 0 26px color-mix(in srgb, var(--acc) 50%, transparent); }
.tile .v.neg { color: var(--bad); text-shadow: 0 0 26px color-mix(in srgb, var(--bad) 40%, transparent); }
.tile .s { font-size: .84rem; color: var(--mist); line-height: 1.45; }

/* marquee */
.marquee { overflow: hidden; border-block: 1px solid var(--line); padding-block: 16px; position: relative; z-index: 2; background: rgba(4, 5, 10, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.marquee .track { display: flex; width: max-content; gap: 44px; animation: slide 46s linear infinite; font: 800 clamp(1rem, 2vw, 1.6rem)/1 var(--display); text-transform: uppercase; letter-spacing: -.01em; white-space: nowrap; }
.marquee .track span { display: inline-flex; align-items: center; gap: 44px; }
.marquee .track span::after { content: ""; width: 9px; height: 9px; background: var(--acc); transform: rotate(45deg); box-shadow: 0 0 14px var(--acc); }
.marquee .track span:nth-child(even) { color: rgba(232, 237, 247, .32); }
@keyframes slide { to { transform: translateX(-50%); } }

/* chapters */
.ch { position: relative; }
.open { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 40px 5vw; align-items: center; padding-block: var(--gap) clamp(48px, 7vw, 100px); }
.open.flip > .slot { order: -1; }
.open h2 { font-size: var(--h2); line-height: .94; letter-spacing: -.04em; margin-top: 20px; }
.open .statement { margin-top: 26px; max-width: 32rem; }
.open .what { margin-top: 16px; max-width: 34rem; color: var(--mist); }
.block { padding-bottom: var(--gap); display: grid; gap: clamp(28px, 4vw, 52px); }
.block h3 { font-size: var(--h3); line-height: 1; letter-spacing: -.03em; margin-top: 14px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 30px; }
.cap { font: 400 .76rem/1.5 var(--mono); letter-spacing: .06em; color: var(--mist); text-transform: uppercase; }
.panel { position: relative; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); padding: 22px; transition: border-color 300ms, transform 400ms var(--ease); }
.panel::before { content: ""; position: absolute; inset: -1px; pointer-events: none; background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--acc) 30%, transparent), transparent 60%); opacity: 0; transition: opacity 300ms; mask: linear-gradient(#000, #000) content-box exclude, linear-gradient(#000, #000); -webkit-mask-composite: xor; padding: 1px; }
.panel:hover { border-color: color-mix(in srgb, var(--acc) 55%, var(--line)); }
.panel:hover::before { opacity: 1; }
.panel::after { content: ""; position: absolute; top: -1px; left: -1px; width: 14px; height: 14px; border-top: 2px solid var(--acc); border-left: 2px solid var(--acc); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.stats .tile .v { font-size: clamp(1.3rem, 2.4vw, 2.2rem); }

/* fights */
.fights { display: grid; gap: 12px; }
.fight { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.3fr) minmax(0, .9fr); gap: 18px 28px; align-items: center; }
.fight .names { display: grid; gap: 4px; }
.fight .names b { font: 600 1.02rem/1.25 var(--body); letter-spacing: -.01em; }
.fight .names b em { font-style: normal; color: var(--mist); font-weight: 300; padding: 0 6px; }
.fight .meta { font: 400 .7rem/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }
.tug { position: relative; height: 26px; }
.tug .track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: var(--line); }
.tug .fill { position: absolute; left: 0; top: 11px; height: 4px; background: color-mix(in srgb, var(--acc) 45%, transparent); width: var(--mk, 50%); transform-origin: left; }
.tug .mk { position: absolute; top: 5px; width: 0; height: 16px; border-left: 2px solid var(--ink); left: var(--x); }
.tug .mk.model { border-color: var(--acc); top: 2px; height: 22px; box-shadow: 0 0 8px var(--acc); }
.tug .mk.blend { border-color: var(--ink); border-style: dashed; }
.nums-row { display: flex; justify-content: space-between; gap: 8px; font: 400 .7rem/1.3 var(--mono); letter-spacing: .06em; color: var(--mist); margin-top: 4px; flex-wrap: wrap; }
.nums-row b { color: var(--ink); font-weight: 500; }
.verdict { display: grid; gap: 6px; justify-items: start; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; font: 500 .78rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.chip.bet { background: var(--acc); color: var(--void); }
.chip.pass { background: transparent; color: var(--mist); box-shadow: inset 0 0 0 1px var(--line); clip-path: none; }
.verdict .why { font-size: .84rem; color: var(--mist); line-height: 1.45; }
.verdict .why b { color: var(--ink); font-weight: 600; }
details.more { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 2px; }
details.more summary { cursor: pointer; font: 400 .72rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mist); list-style: none; display: flex; gap: 10px; align-items: center; }
details.more summary::before { content: "+"; color: var(--acc); font-size: 1rem; line-height: 1; }
details.more[open] summary::before { content: "-"; }
details.more summary::-webkit-details-marker { display: none; }
.more-body { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-top: 12px; font-size: .88rem; color: #c3cbdb; }
.more-body span em { font-style: normal; color: var(--mist); font: 400 .7rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding-right: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 400 .7rem/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }
.legend i { display: inline-block; width: 0; height: 12px; border-left: 2px solid var(--ink); margin-right: 8px; vertical-align: -2px; }
.legend i.m { border-color: var(--acc); }
.legend i.b { border-style: dashed; }

/* results */
.win { color: var(--acc); font-weight: 700; }
.picks2 { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.pk { font: 400 .7rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border: 1px solid var(--line); white-space: nowrap; }
.pk.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.pk.no { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.accrow { display: grid; grid-template-columns: 96px minmax(0, 1fr) 50px; gap: 12px; align-items: center; margin-bottom: 14px; font: 400 .74rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mist); }
.accbar { position: relative; height: 18px; background: var(--line); }
.accbar .rng { position: absolute; top: 5px; height: 8px; background: color-mix(in srgb, var(--acc) 35%, transparent); }
.accbar .dot { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; background: var(--acc); transform: rotate(45deg); box-shadow: 0 0 12px var(--acc); }
.accbar .coin { position: absolute; left: 50%; top: -3px; height: 24px; border-left: 1px dashed var(--ink); }
.accrow .val { color: var(--ink); text-align: right; }
/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 400 11px var(--mono); fill: var(--mist); letter-spacing: .06em; }
.chart .zero { stroke: var(--ink); stroke-width: 1; opacity: .55; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .bar-m { fill: var(--acc); opacity: .75; transform-box: fill-box; transform-origin: bottom; }
.chart .bar-k { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .6; transform-box: fill-box; transform-origin: bottom; }
.chart .wh { transform-box: fill-box; transform-origin: center; }
.chart .lab { fill: var(--ink); font: 400 12px var(--body); letter-spacing: 0; }
.twocol { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 24px; }

/* timeline */
.timeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 6px; right: 6px; top: 7px; height: 1px; background: var(--line); }
.node { position: relative; padding-top: 28px; display: grid; gap: 6px; align-content: start; }
.node::before { content: ""; position: absolute; top: 0; left: 0; width: 15px; height: 15px; transform: rotate(45deg) scale(.6); border: 1px solid var(--mist); background: var(--void); }
.node.done::before { background: var(--acc); border-color: var(--acc); box-shadow: 0 0 14px var(--acc); transform: rotate(45deg) scale(.7); }
.node.upcoming::before, .node.due::before { border-color: var(--acc); }
.node.missed::before { border-color: var(--bad); }
.node b { font: 600 .98rem/1.2 var(--body); }
.node .t { font: 400 .72rem/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mist); }
.node .st { font: 500 .7rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--acc); }
.node.missed .st { color: var(--bad); }
.picks { display: grid; gap: 10px; }
.pickrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 18px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.pickrow:last-child { border-bottom: 0; padding-bottom: 0; }
.pickrow b { font-weight: 600; }
.tier { font: 500 .68rem/1 var(--mono); letter-spacing: .12em; color: var(--void); background: var(--acc); padding: 4px 8px; margin-left: 8px; }
.prose { display: grid; gap: 14px; color: #c9d1e1; max-width: 40rem; }
.flow { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: s; }
.flow li { counter-increment: s; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: start; font-size: 1.05rem; line-height: 1.45; }
.flow li::before { content: counter(s, decimal-leading-zero); font: 500 .8rem/1 var(--mono); color: var(--acc); padding-top: 6px; letter-spacing: .08em; }
.divider { height: 1px; background: var(--line); position: relative; transform-origin: left; }
.divider::after { content: ""; position: absolute; right: 0; top: -4px; width: 9px; height: 9px; background: var(--acc); transform: rotate(45deg); box-shadow: 0 0 14px var(--acc); }
.foot { padding-block: var(--gap) 64px; }
.foot .big { font: 800 clamp(2.6rem, 11.5vw, 12.5rem)/.9 var(--display); letter-spacing: -.04em; text-transform: uppercase; color: rgba(232, 237, 247, .16); position: relative; }
.foot .big span { position: absolute; inset: 0; color: var(--ink); clip-path: inset(0 calc(100% - var(--fill, 0%)) 0 0); }
.foot-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px 48px; margin-top: 40px; }
.foot .fine { font-size: .9rem; max-width: 40rem; color: var(--mist); }

@media (max-width: 900px) {
  .hero-row, .open, .twocol, .fight { grid-template-columns: minmax(0, 1fr); }
  .open.flip > .slot { order: 0; }
  .open > .slot, .hero-row > .slot { order: -1; max-width: 460px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rail, .corner { display: none; }
  .topbar nav a:not(.btn) { display: none; }
  .timeline { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
  .timeline::before { display: none; }
}
@media (max-width: 560px) { .tiles { grid-template-columns: minmax(0, 1fr); } .meter { display: none; } }
@media (prefers-reduced-motion: reduce) { .fx.grain, .marquee .track, .live::before { animation: none; } * { transition-duration: .01ms !important; } }

<script>
/* Render from the exported data, then add the motion. Every number on the page is read from the data block. */
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var gbp = function (x, signed) { var a = Math.abs(x), s = a >= 100 ? a.toFixed(0) : a.toFixed(2); return (x < 0 ? '-' : (signed && x > 0 ? '+' : '')) + '£' + s; };
  var pc = function (x, d) { return (x * 100).toFixed(d == null ? 0 : d) + '%'; };
  var DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var dLabel = function (iso) { var d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : '')); return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
  var tLabel = function (iso) { var d = new Date(iso); return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  var ACCS = ['#FF3D4F', '#2EF2A0', '#FFC21A', '#5CE1FF'], RINGS = ['mma', 'cp', 'rs', 'elo'];
  var cards = D.cards, first = cards[0];
  var plural = function (n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); };

  /* ---- hero ---- */
  var heroVerdict = first.bets ? 'The rule found ' + plural(first.bets, 'small edge') + ' on ' + first.name + ', worth ' + gbp(first.staked) + ' in total.' : 'The rule found nothing worth betting on ' + first.name + '.';
  var h = '';
  h += '<section class="ch" id="top" data-key="top" data-name="Verdict" data-acc="#5CE1FF" aria-labelledby="hero-h"><div class="wrap hero"><div class="scanline" aria-hidden="true"></div>';
  h += '<p class="tag" data-in>MMA predictor, paper desk</p><h1 id="hero-h" data-split><span class="w">Fight</span><span class="w">Signal</span></h1>';
  h += '<div class="hero-row"><div>';
  h += '<p class="statement" data-in>Next card: <b style="font-weight:600">' + esc(first.name) + '</b>, ' + dLabel(first.dates[0]) + ', in ' + plural(first.days, 'day') + '. ' + esc(heroVerdict) + '</p>';
  h += '<div class="tiles">';
  h += '<div class="panel tile" data-tilt data-in><span class="k">What to bet</span><span class="v">' + plural(first.bets, 'bet') + '</span><span class="s">of ' + first.n_fights + ' fights; ' + first.n_priced + ' have a price so far.</span></div>';
  h += '<div class="panel tile" data-tilt data-in><span class="k">How much</span><span class="v" data-count="' + first.staked + '" data-fmt="gbp">' + gbp(first.staked) + '</span><span class="s">out of a ' + gbp(D.budget) + ' budget for the card. The rest stays unspent.</span></div>';
  h += '<div class="panel tile" data-tilt data-in><span class="k">Expected earnings</span><span class="v' + ((first.ev_market || 0) < 0 ? ' neg' : '') + '">' + (first.ev_model == null ? 'n/a' : gbp(first.ev_model, true)) + '</span><span class="s">if the model is right. If the market is right: ' + (first.ev_market == null ? 'n/a' : gbp(first.ev_market, true)) + '.</span></div>';
  h += '<div class="panel tile" data-tilt data-in><span class="k">Reality check</span><span class="v">~' + gbp(D.backtest.per_card) + '</span><span class="s">a card in past tests of this rule (' + D.backtest.events + ' cards), indistinguishable from zero.</span></div>';
  h += '</div>';
  h += '<p class="notice" data-in>Research tool, paper trading only. In every test so far the model has not beaten the betting market, so stakes are kept small. Nothing here is advice to stake money.</p>';
  h += '</div><div class="slot" data-obj="mma" data-ring="#5CE1FF" role="img" aria-label="An eight-sided fight cage lit in blue"></div></div></div></section>';
  h += '<div class="marquee" aria-hidden="true"><div class="track">' + [0, 1].map(function () { return cards.map(function (c) { return '<span>' + esc(c.name) + '</span><span>' + c.bets + ' bets, ' + gbp(c.staked) + '</span>'; }).join('') + '<span>Model vs market, ' + D.gap.diff.toFixed(3) + ' behind</span><span>Paper test, ' + D.forward.logged + ' picks logged</span>'; }).join('') + '</div></div>';

  /* ---- results of cards already fought ---- */
  var RC = ((D.results && D.results.cards) || []).slice().reverse();
  RC.forEach(function (rc, ri) {
    var s = rc.stats, key = 'res' + ri, bs = rc.bets_summary, ps = rc.picks_summary, last = function (n) { return n.split(' ').slice(-1)[0]; };
    var binom = function (n, k) { var c = 1; for (var i = 1; i <= k; i++) c = c * (n - k + i) / i; return c; };
    var tail = 0; for (var kk = s.model.k; kk <= s.n; kk++) tail += binom(s.n, kk) / Math.pow(2, s.n);
    var slotName = { thu: 'Thursday', mon: 'Monday', pre: 'pre-fight', listed: 'first-listed', manual: 'manual' }[rc.slot] || rc.slot;

    h += '<section class="ch" id="' + key + '" data-key="' + key + '" data-name="Results" data-acc="#2EF2A0" style="--acc:#2EF2A0" aria-labelledby="' + key + '-h"><div class="wrap">';

      h += '<div class="panel tile" data-tilt data-in><span class="k">' + m[0] + '</span><span class="v">' + m[1].k + '/' + m[1].n + '</span><span class="s">' + pc(m[1].k / m[1].n) + ' right. A 95% range for the true rate: ' + pc(m[1].ci[0]) + ' to ' + pc(m[1].ci[1]) + '.</span></div>';
    });
    h += '</div>';
    h += '<div class="twocol"><div class="panel" data-in><p class="tag">How sure, how right</p><h3>Accuracy</h3><div class="accs" style="margin-top:22px">';
    [['Model alone', s.model], ['Blend', s.blend], ['Market', s.market], ['Elo', s.elo]].forEach(function (m) {
      h += '<div class="accrow"><span class="lb">' + m[0] + '</span><div class="accbar"><i class="rng" style="left:' + (m[1].ci[0] * 100) + '%;width:' + ((m[1].ci[1] - m[1].ci[0]) * 100) + '%"></i><i class="dot" style="left:' + (m[1].k / m[1].n * 100) + '%"></i><i class="coin"></i></div><span class="val">' + m[1].k + '/' + m[1].n + '</span></div>';
    });
    h += '</div><p class="cap" style="margin-top:14px">Dot: share right. Band: 95% range. Line: a coin flip (50%).</p></div>';
    h += '<div class="panel" data-in><p class="tag">Probability quality</p><h3>Log loss, lower is better</h3><table style="margin-top:14px"><tbody>';
    [['Model alone', s.ll.model, s.brier.model], ['Blend', s.ll.blend, s.brier.blend], ['Market', s.ll.market, s.brier.market], ['Elo', s.ll.elo, s.brier.elo], ['Coin flip', s.ll.coin, 0.25]].forEach(function (r) { h += '<tr><td>' + r[0] + '</td><td>' + r[1].toFixed(3) + '</td><td class="cap">Brier ' + r[2].toFixed(3) + '</td></tr>'; });
    h += '</tbody></table><p class="cap" style="margin-top:14px">When the model and market disagreed (' + s.disagree.n + ' fights): model right ' + s.disagree.model_right + ', market right ' + s.disagree.market_right + '.</p></div></div>';
    h += '<div class="panel" data-in><p class="tag">Calibration</p><h3>Did confidence match results?</h3><table style="margin-top:14px"><thead><tr><th>Model confidence</th><th>Fights</th><th>Said</th><th>Right</th></tr></thead><tbody>';
    s.buckets.forEach(function (b) { h += '<tr><td>' + b.name + '</td><td>' + b.n + '</td><td>' + (b.said == null ? '' : pc(b.said)) + '</td><td>' + (b.n ? b.hit + '/' + b.n + ' (' + pc(b.hit / b.n) + ')' : '') + '</td></tr>'; });
    h += '</tbody></table></div>';
    h += '<div><div class="sec-head" data-in><div><p class="tag">Fight by fight</p><h3>Who won, who called it</h3></div></div><div class="fights" style="margin-top:18px">';
    rc.fights.forEach(function (x) {
      var bet = rc.bets.filter(function (b) { return b.fighter === x.a || b.fighter === x.b; })[0], loser = x.winner === x.a ? x.b : x.a;
      var mk = function (lbl, pick, ok) { return pick == null ? '' : '<span class="pk ' + (ok ? 'ok' : 'no') + '">' + lbl + ' ' + esc(last(pick)) + ' ' + (ok ? 'right' : 'wrong') + '</span>'; };

      h += '<div class="picks2">' + mk('Model', x.pick_model, x.ok_model) + mk('Blend', x.pick_blend, x.ok_blend) + mk('Market', x.pick_mkt, x.ok_mkt) + mk('Elo', x.pick_elo, x.ok_elo) + '</div>';

      h += '</article>';
    });
    h += '</div></div>';
    h += '<div class="twocol"><div class="panel" data-in><p class="tag">Money</p><h3>The bets</h3><table style="margin-top:14px"><thead><tr><th>Bet</th><th>Price</th><th>Staked</th><th>Result</th></tr></thead><tbody>';
    rc.bets.forEach(function (b) { h += '<tr><td>' + esc(b.fighter) + '</td><td>' + b.price.toFixed(2) + '</td><td>' + gbp(b.stake) + '</td><td>' + (b.status === 'won' ? 'won ' : 'lost ') + gbp(b.pnl, true) + '</td></tr>'; });
    h += '<tr class="final"><td>Total</td><td></td><td>' + gbp(bs.staked) + '</td><td>' + gbp(bs.pnl, true) + '</td></tr></tbody></table><p class="cap" style="margin-top:14px">At a ' + gbp(1000) + ' budget the same bets staked ' + gbp(bs.staked_1000) + ' and finished ' + gbp(bs.pnl_1000, true) + ' (' + (bs.pnl_1000 / 1000 * 100).toFixed(2) + '% of the budget).</p></div>';
    h += '<div class="panel" data-in><p class="tag">Paper test</p><h3>Confident picks</h3><div class="picks" style="margin-top:20px">';
    rc.picks.forEach(function (p) { h += '<div class="pickrow"><span><b>' + esc(p.fighter) + '</b> over ' + esc(p.vs) + '<span class="tier">' + esc(p.tier) + '</span></span><span class="cap">' + (p.status === 'won' ? 'won' : 'lost') + ' ' + gbp(p.pnl, true) + ' on ' + gbp(10) + ' paper at ' + p.price.toFixed(2) + '</span></div>'; });
    if (!rc.picks.length) h += '<p class="cap">No pick at 70% or more on this card.</p>';
    h += '</div><p class="what" style="margin-top:18px;color:var(--mist);font-size:.92rem">' + ps.won + ' of ' + ps.n + ' won. Far too few to judge: the test needs ' + D.forward.needed + ' graded picks.</p></div></div>';
    h += '<div class="notice" data-in>' + s.n + ' fights is far too few to tell skill from luck. A coin flip picks ' + s.model.k + ' or more of ' + s.n + ' right ' + pc(tail) + ' of the time, and the 95% range for the model\'s true accuracy runs from ' + pc(s.model.ci[0]) + ' to ' + pc(s.model.ci[1]) + '. The market was ahead on probability quality here, as it has been in every past test.</div>';

    h += '<div class="block">';
    h += '<div class="stats">';

    h += '<div class="panel tile" data-tilt data-in><span class="k">Earnings if the market is right</span><span class="v' + ((c.ev_market || 0) < 0 ? ' neg' : '') + '">' + (c.ev_market == null ? 'n/a' : gbp(c.ev_market, true)) + '</span><span class="s">same bets, market probabilities</span></div>';
    h += '<div class="panel tile" data-tilt data-in><span class="k">Chance of a profit</span><span class="v">' + (c.sim_model ? pc(c.sim_model.p_profit) : 'n/a') + '</span><span class="s">' + (c.sim_market ? 'market view: ' + pc(c.sim_market.p_profit) + '. ' : '') + (c.sim_model ? '5th to 95th percentile ' + gbp(c.sim_model.p05, true) + ' to ' + gbp(c.sim_model.p95, true) : 'no bets to simulate') + '</span></div>';
    h += '</div>';
    if (c.sim_model) {

      }

  Promise.race([ready, new Promise(r => setTimeout(r, 1500))]).then(() => requestAnimationFrame(frame), () => requestAnimationFrame(frame));
} catch (err) { console.warn('3D layer not started:', err && err.message); }
</script>
