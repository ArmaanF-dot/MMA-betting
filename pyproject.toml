[project]
name = "ufcmodel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "duckdb==2.0.0",
  "pyyaml==6.0.3",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
